name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: uptime-monitor
  TERRAFORM_VERSION: "~1.13.0"

jobs:
  # ---------------------------------------------------------------------------
  # CI: runs on every push and pull request. Nothing is deployed here.
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python, Docker, Terraform)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest + moto)
        run: pytest -v

      - name: Build Docker image
        run: docker build --platform linux/amd64 --provenance=false -t uptime-monitor:test .

      - name: Test the container locally (Lambda runtime emulator)
        run: |
          docker run -d --name app -p 9000:8080 \
            -e AWS_DEFAULT_REGION=eu-north-1 -e APP_VERSION=ci-test uptime-monitor:test
          sleep 3
          RESPONSE=$(curl -s -X POST "http://localhost:9000/2015-03-31/functions/function/invocations" \
            -d '{"rawPath":"/health","requestContext":{"http":{"method":"GET"}}}')
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | jq -e '.statusCode == 200 and (.body | fromjson | .version == "ci-test")'
          docker rm -f app

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Terraform
        run: |
          for dir in terraform/bootstrap terraform/app; do
            echo "::group::$dir"
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # CD: only after tests pass, and only on the main branch.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AWS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # needed only for the OIDC login option
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_app_version: ${{ github.sha }}
      TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Two supported login methods:
      #  - OIDC (no stored keys): set the variable AWS_ROLE_ARN
      #  - Access key (AWS Free-plan accounts): set the secrets
      #    AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, leave AWS_ROLE_ARN unset
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$PROJECT_NAME:${GITHUB_SHA}"
          docker build --platform linux/amd64 --provenance=false -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform -chdir=terraform/app init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform apply
        env:
          TF_VAR_image_uri: ${{ steps.image.outputs.uri }}
          TARGET_URLS: ${{ vars.TARGET_URLS }}
        run: |
          if [ -n "$TARGET_URLS" ]; then export TF_VAR_target_urls="$TARGET_URLS"; fi
          terraform -chdir=terraform/app apply -auto-approve -input=false

      - name: Smoke test the live API
        run: |
          URL=$(terraform -chdir=terraform/app output -raw dashboard_url)
          URL="${URL%/}"
          echo "Dashboard: $URL"
          for i in 1 2 3 4 5; do
            if curl -sf "$URL/health" | jq -e --arg v "$GITHUB_SHA" '.version == $v'; then
              OK=1; break
            fi
            echo "Not ready yet, retrying in 5s..."; sleep 5
          done
          [ "${OK:-0}" = "1" ] || { echo "Smoke test failed"; exit 1; }
          {
            echo "### :rocket: Deployed \`${GITHUB_SHA::7}\`"
            echo ""
            echo "- Dashboard: $URL/"
            echo "- Health: $URL/health"
            echo "- Status API: $URL/api/status"
          } >> "$GITHUB_STEP_SUMMARY"
